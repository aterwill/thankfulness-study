<body>
<div class="app">
<div class="header">
  <div class="header-top">
    <div class="cross-badge">&#10022;</div>
    <h1>Thankfulness to God for His Rich Mercies &amp; Grace</h1>
  </div>
  <div class="header-sub">A seven-part Bible study for small groups.</div>
</div>
<div class="lesson-nav">
  <button class="lesson-btn active" onclick="selectLesson(0)">Lesson 1</button>
  <button class="lesson-btn" onclick="selectLesson(1)">Lesson 2</button>
  <button class="lesson-btn" onclick="selectLesson(2)">Lesson 3</button>

</div>

</div>

<script>
// ── Notes store (in-memory per lesson) ──
var notesData = {};
var discussNotes = {}; // {lessonIdx: {qIdx: text}}
var sessionDates = {}; // {lessonIdx: dateString}
function getSessionDate(i){ return sessionDates[i]||''; }
function saveSessionDate(i, val){
  sessionDates[i] = val;
  var st = document.getElementById('date-saved-status');
  if(st){ st.textContent='\u2713 Saved'; setTimeout(function(){ st.textContent=''; },1500); }
}
function getDNote(li,qi){ return ((discussNotes[li]||{})[qi])||''; }
function setDNote(li,qi,val){
  if(!discussNotes[li]) discussNotes[li]={};
  discussNotes[li][qi]=val;
}
function getNotes(i){ return (notesData[i]||{}).text||''; }
function getLinks(i){ return (notesData[i]||{}).links||[]; }
function ensureStore(i){ if(!notesData[i]) notesData[i]={text:'',links:[]}; }

// ── ESV Bible links ──
function esvUrl(ref){
  var skip = ['HC ','WCF','WSC'];
  for(var i=0;i<skip.length;i++){ if(ref.indexOf(skip[i])===0) return null; }
  // YouVersion ESV deep link
  return 'https://www.bible.com/bible/59/'+youversionRef(ref);
}
function youversionRef(ref){
  // Convert "John 3:16" -> "JHN.3.16" etc.
  var books = {
    'Gen':'GEN','Genesis':'GEN','Ex':'EXO','Exod':'EXO','Exodus':'EXO',
    'Lev':'LEV','Leviticus':'LEV','Num':'NUM','Numbers':'NUM',
    'Deut':'DEU','Deuteronomy':'DEU','Josh':'JOS','Joshua':'JOS',
    'Judg':'JDG','Judges':'JDG','Ruth':'RUT',
    '1 Sam':'1SA','1 Samuel':'1SA','2 Sam':'2SA','2 Samuel':'2SA',
    '1 Kgs':'1KI','1 Kings':'1KI','2 Kgs':'2KI','2 Kings':'2KI',
    '1 Chr':'1CH','1 Chronicles':'1CH','2 Chr':'2CH','2 Chronicles':'2CH',
    'Ezra':'EZR','Neh':'NEH','Nehemiah':'NEH','Esth':'EST','Esther':'EST',
    'Job':'JOB','Ps':'PSA','Psalm':'PSA','Psalms':'PSA',
    'Prov':'PRO','Proverbs':'PRO','Eccl':'ECC','Ecclesiastes':'ECC',
    'Song':'SNG','Isa':'ISA','Isaiah':'ISA','Jer':'JER','Jeremiah':'JER',
    'Lam':'LAM','Lamentations':'LAM','Ezek':'EZK','Ezekiel':'EZK',
    'Dan':'DAN','Daniel':'DAN','Hos':'HOS','Hosea':'HOS',
    'Joel':'JOL','Amos':'AMO','Obad':'OBA','Jonah':'JON','Mic':'MIC',
    'Nah':'NAM','Hab':'HAB','Zeph':'ZEP','Hag':'HAG','Zech':'ZEC','Mal':'MAL',
    'Matt':'MAT','Matthew':'MAT','Mark':'MRK','Luke':'LUK','John':'JHN',
    'Acts':'ACT','Rom':'ROM','Romans':'ROM',
    '1 Cor':'1CO','1 Corinthians':'1CO','2 Cor':'2CO','2 Corinthians':'2CO',
    'Gal':'GAL','Galatians':'GAL','Eph':'EPH','Ephesians':'EPH',
    'Phil':'PHP','Philippians':'PHP','Col':'COL','Colossians':'COL',
    '1 Thess':'1TH','1 Thessalonians':'1TH','2 Thess':'2TH','2 Thessalonians':'2TH',
    '1 Tim':'1TI','1 Timothy':'1TI','2 Tim':'2TI','2 Timothy':'2TI',
    'Titus':'TIT','Philem':'PHM','Heb':'HEB','Hebrews':'HEB',
    'Jas':'JAS','James':'JAS','1 Pet':'1PE','1 Peter':'1PE',
    '2 Pet':'2PE','2 Peter':'2PE','1 John':'1JN','2 John':'2JN','3 John':'3JN',
    'Jude':'JUD','Rev':'REV','Revelation':'REV'
  };
  // Strip version suffix like "(ESV)"
  ref = ref.replace(/\s*\(.*?\)\s*$/,'').trim();
  // Match book + chapter:verse
  var m = ref.match(/^(.+?)\s+(\d+)(?::(\d+)(?:[\u2013\-](\d+))?)?/);
  if(!m) return encodeURIComponent(ref);
  var book = m[1].trim();
  var ch   = m[2];
  var vs   = m[3]||'1';
  var code = books[book] || book.toUpperCase().replace(/\s/g,'');
  return code+'.'+ch+'.'+vs+'.ESV';
}

// ── Lesson data ──
var lessons = [
  {
    num:'Lesson 1', title:'The Prodigal Son: Grace That Runs to Meet Us',
    subtitle:'Luke 15:11\u201332 \u2014 God\'s mercy to the wayward and the welcome home',
    date:'Monday, June 2, 2025', duration:'60 min', theme:'Undeserved Welcome',
    verses:[
      {ref:'Luke 15:20 (ESV)', text:'But while he was still a long way off, his father saw him and felt compassion, and ran and embraced him and kissed him.'},
      {ref:'Luke 15:22\u201324 (ESV)', text:'But the father said to his servants, \u2018Bring quickly the best robe, and put it on him\u2026 for this my son was dead, and is alive again; he was lost, and is found.\u2019'},
      {ref:'Ephesians 2:4\u20135 (ESV)', text:'But God, being rich in mercy, because of the great love with which he loved us, even when we were dead in our trespasses, made us alive together with Christ.'}
    ],
    study:'<p>The parable of the Prodigal Son stands as one of the most luminous illustrations of divine grace in all of Scripture. A son who has squandered his inheritance, shamed his family, and reduced himself to feeding pigs in a foreign land \u2014 this is a picture of humanity in rebellion against God. Yet what makes this story so breathtaking is not the son\u2019s repentance, but the father\u2019s response.</p><p>In the ancient Near Eastern world, a father running toward a returning son would have been scandalous \u2014 undignified, even shameful. Yet the father in Jesus\u2019s parable does exactly this. He sees his son from a distance, is filled with compassion, <em>runs</em>, embraces, and kisses him. This is not a grudging acceptance. This is extravagant, costly, joyful grace.</p><p>This parable shows us beautifully that God is the one who initiates, who pursues, and whose love is not based on our worthiness or our effort. The father is already watching before the son arrives. God\u2019s mercy is not a reaction to our goodness; it is the very source of our restoration.</p>',
    illustration:{icon:'&#128205;', title:'Historical context: The far country', body:'The son\u2019s journey to \u2018a far country\u2019 echoes the exile motif throughout Scripture. The \u2018pods\u2019 he fed to pigs were likely carob husks, considered fit only for animals by Jewish standards. His destitution was total and self-inflicted \u2014 making the father\u2019s welcome all the more remarkable.'},
    application:'Consider a time when you experienced unexpected grace from another person \u2014 or from God. How did that moment shape your understanding of God\u2019s character? What does it mean to you personally that God \u2018runs\u2019 toward the repentant?',
    questions:[
      {q:'Why do you think Jesus described the father as running to meet his son? What does this reveal about the character of God?', refs:['Luke 15:20','Ps 103:8\u201312']},
      {q:'The older son represents those who believe their faithfulness earns God\u2019s favor. Have you ever felt like the older son? How does grace challenge that posture?', refs:['Luke 15:25\u201330','Rom 3:21\u201324']},
      {q:'In what ways does this parable speak to those of us who have lived long enough to look back on God\u2019s patient mercy in our own lives?', refs:['Lam 3:22\u201323','Ps 136:1']},
      {q:'What does it mean to you personally to know that you fully belong to Jesus \u2014 body and soul? How does that assurance connect to the son\u2019s discovery that he is \u2018found\u2019?', refs:['Rom 8:38-39','Luke 15:24']}
    ],
    video:{title:'The Prodigal Son \u2014 Setting the Scene', desc:'A 12-minute overview of Luke 15 in its cultural and theological context, suitable for opening the session.', url:'https://www.youtube.com/results?search_query=prodigal+son+luke+15+bible+study'},
    prayerOpen:'<em>Open with something like:</em> \u201cFather, thank You for bringing us together tonight\u2026\u201d<br><br><strong>Pray through these together:</strong><ul style=\"margin:0.5rem 0 0.5rem 1.25rem;line-height:2\"><li>Gratitude that God welcomes us just as we are, no matter where we\u2019ve been</li><li>Ask God to open our hearts and minds as we study His Word together</li><li>Pray for each person in the room \u2014 that they would feel the Father\u2019s welcome tonight</li><li>Ask for the Holy Spirit to guide the conversation</li></ul><em>Close with something like:</em> \u201c\u2026in the name of Jesus, who came to seek and save the lost. Amen.\u201d',
    prayerClose:'<em>Open with something like:</em> \u201cLord, as we close this time together\u2026\u201d<br><br><strong>Pray through these together:</strong><ul style=\"margin:0.5rem 0 0.5rem 1.25rem;line-height:2\"><li>Thank God for a specific mercy or grace that came up in the discussion tonight</li><li>Ask Him to help us carry the spirit of the prodigal\u2019s father into our own relationships this week</li><li>Pray for anyone in the group who may be in their own \u201cfar country\u201d \u2014 or welcoming someone home</li></ul><em>Close with something like:</em> \u201c\u2026send us home with grateful hearts. In Jesus\u2019 name, Amen.\u201d',
    music:{title:'Amazing Grace (My Chains Are Gone)', artist:'Chris Tomlin', note:'A modern arrangement of the classic hymn \u2014 connects beautifully to the theme of the lost being found.', url:'https://www.youtube.com/results?search_query=amazing+grace+my+chains+are+gone+chris+tomlin'},
    p1:'<p>There is a well-known story about a father in a small Texas town whose teenage son ran away from home after a bitter argument. For three years, the father heard nothing. Then one day, a neighbor spotted the boy \u2014 now a young man, gaunt and clearly struggling \u2014 sitting on a bench at the Greyhound bus station in Dallas. The neighbor called the father, who drove four hours without stopping. When he walked into that station and saw his son, he didn\u2019t wait for an apology. He crossed the room at a near-run and grabbed him in a bear hug so fierce the boy broke down weeping on the spot.</p><p>That father had been <em>watching</em>. Every day for three years, hoping. Jesus\u2019s parable of the Prodigal Son (Luke 15:11\u201332) tells the same story \u2014 but about God.</p><p>The son demands his inheritance early \u2014 essentially telling his father, \u201cI wish you were dead.\u201d He takes the money, travels to a distant country, and wastes everything on reckless living. When a famine hits and the money runs out, he ends up feeding pigs. Starving, he comes to his senses and begins the long walk home, expecting judgment. What he receives instead will change everything he thought he knew about his father.</p>',
    p2:'<p><strong>The father ran.</strong> Luke 15:20 records one of the most theologically loaded verbs in the entire Gospel: the father \u201csaw him and felt compassion, and <em>ran</em>.\u201d In the culture of the ancient Near East, a man of standing did not run \u2014 it was undignified. He was willing to be shamed in order to reach his son first.</p><p>He doesn\u2019t wait for the speech. He calls for the best robe, a ring, sandals \u2014 signs of full sonship restored. He throws a party: \u201cThis my son was dead, and is alive again; he was lost, and is found.\u201d</p><p>This is the picture Jesus paints of God\u2019s grace toward us. He is the father who has been watching the road \u2014 and who, when He sees us while we are still \u201ca long way off,\u201d runs. For those of us who have lived many years, this parable invites us to look back and ask: where did the Father run to meet <em>you</em>? What moment of unexpected grace speaks of this God who watches and runs? The appropriate response is not pride in the journey. It is the son\u2019s posture: falling at the father\u2019s feet, undone by a love that will not let us go. And from that posture flows genuine, lasting thankfulness.</p>',
    i1:{title:'A modern echo: the waiting father', text:'The Texas bus station story reflects something universal \u2014 the parent who never stops watching. Many in your group will recognize this posture from their own experience as parents or grandparents. That recognition is itself a window into the heart of God.'},
    i2:{title:'The robe, the ring, and the sandals', text:'Each item the father gives carries weight: the best robe covered the son\u2019s rags (dignity restored); the ring signified family authority; sandals distinguished a free son from a barefoot slave. Restoration was total, not partial. God\u2019s grace does not leave us half-restored.'}
,
    leaderIntro:'<p>Tonight we begin our study on <strong>Thankfulness to God for His Rich Mercies and Grace</strong>, and we\u2019re starting right in the heart of it \u2014 with one of the most beloved stories Jesus ever told.</p> <p>Most of us have heard the story of the Prodigal Son so many times that we might think we already know it. But I want to invite you tonight to hear it as if for the first time \u2014 because there is something in it that has the power to completely reshape the way we understand God\u2019s character.</p> <p>The story is really about a father. A father who watches, who waits, who runs. And what Jesus is telling us through that father is something almost too good to be true: that God\u2019s response to us \u2014 no matter where we\u2019ve been or what we\u2019ve done \u2014 is not reluctant forgiveness. It\u2019s a sprint down the road to meet us.</p> <p>As we go through this seven-part study together, we\u2019ll be looking at stories from Scripture that put flesh on what God\u2019s grace and mercy actually look like in real life. Tonight\u2019s story is our foundation. If we can really grasp the image of a father who runs \u2014 who sees us while we\u2019re still a long way off \u2014 then we\u2019ll have something to measure everything else against.</p> <p>So let\u2019s lean in. Let\u2019s ask ourselves honestly: Do I really believe God runs toward me? And if I do \u2014 what does that do to my thankfulness?</p>'  },
  {
    num:'Lesson 2', title:'Ruth and Boaz: Hesed \u2014 Covenant Lovingkindness',
    subtitle:'Ruth 2\u20134 \u2014 God\u2019s steadfast love through unexpected instruments',
    date:'Monday, June 16, 2025', duration:'60 min', theme:'Steadfast Covenant Love',
    verses:[
      {ref:'Ruth 2:12 (ESV)', text:'The Lord repay you for what you have done, and a full reward be given you by the Lord, the God of Israel, under whose wings you have come to take refuge.'},
      {ref:'Ruth 3:9 (ESV)', text:'She said, \u2018I am Ruth, your servant. Spread your wings over your servant, for you are a redeemer.\u2019'},
      {ref:'Psalm 36:7 (ESV)', text:'How precious is your steadfast love, O God! The children of mankind take refuge in the shadow of your wings.'}
    ],
    study:'<p>The book of Ruth is a gem of narrative theology, set against the dark backdrop of the period of the Judges. Into this moral and spiritual chaos steps a Moabite widow named Ruth, whose loyalty to her mother-in-law Naomi and to Israel\u2019s God becomes a portrait of the very <em>hesed</em> \u2014 covenant lovingkindness \u2014 that God shows to His people.</p><p>The Hebrew word <strong>hesed</strong> — often translated “steadfast love” or “lovingkindness” — captures a loyalty that goes beyond obligation. It is love that persists when it doesn\u2019t have to. When Boaz spreads his \u201cwings\u201d over Ruth, he is enacting in human form what God does for His people \u2014 sheltering, redeeming, restoring.</p><p>For a senior adult group, this study is deeply personal. Many have experienced decades of God\u2019s hesed \u2014 mercies that did not have to come, that arrived in the form of a neighbor, a spouse, a church family, a provision when there seemed to be none. Ruth\u2019s story names what many have quietly lived.</p>',
    illustration:{icon:'&#127806;', title:'The custom of gleaning', body:'Leviticus 19:9\u201310 commanded landowners to leave field edges unharvested for the poor. Boaz goes beyond this \u2014 he instructs workers to deliberately leave extra grain for Ruth. This is grace exceeding the law, a picture of how God\u2019s mercy surpasses what justice requires.'},
    application:'Reflect on a moment when someone showed you unexpected kindness \u2014 hesed \u2014 that you did not earn. How was God\u2019s own mercy present in that moment?',
    questions:[
      {q:'What does hesed teach us about the nature of God\u2019s mercy? How is it different from general kindness?', refs:['Ruth 2:20','Ps 136','Lam 3:22\u201323']},
      {q:'Boaz was Ruth\u2019s kinsman-redeemer. How does this role point us forward to Christ as our Redeemer?', refs:['Ruth 4:14','Gal 4:4\u20135','Heb 2:14\u201317']},
      {q:'Naomi felt God had dealt bitterly with her (Ruth 1:20). Have you ever felt that way? How does the end of the story speak to seasons of feeling abandoned?', refs:['Ruth 1:20\u201321','Ruth 4:14\u201316']},
      {q:'How does the story of Ruth show us that God\u2019s love for His people is not based on what we deserve, but on His own faithful character and promises?', refs:['Jer 31:31-34','Ruth 2:12']}
    ],
    video:{title:'Ruth and Boaz: Hesed in the Ancient World', desc:'A 10-minute introduction to the cultural, historical, and theological background of the book of Ruth.', url:'https://www.youtube.com/results?search_query=book+of+ruth+hesed+bible+study'},
    prayerOpen:'<em>Open with something like:</em> \u201cFather, Your faithfulness has followed us through every season of life\u2026\u201d<br><br><strong>Pray through these together:</strong><ul style=\"margin:0.5rem 0 0.5rem 1.25rem;line-height:2\"><li>Thank God for His steadfast love \u2014 a love that never quits, even when life is hard</li><li>Ask Him to open our eyes to see His faithfulness woven through Ruth\u2019s story \u2014 and our own</li><li>Pray for anyone in the group walking through a \u201cfamine season\u201d right now</li><li>Ask for open hearts and good conversation tonight</li></ul><em>Close with something like:</em> \u201c\u2026we trust You, Lord. In Jesus\u2019 name, Amen.\u201d',
    prayerClose:'<em>Open with something like:</em> \u201cLord, thank You for meeting us in Your Word tonight\u2026\u201d<br><br><strong>Pray through these together:</strong><ul style=\"margin:0.5rem 0 0.5rem 1.25rem;line-height:2\"><li>Name one specific way God has shown His steadfast love to someone in the group</li><li>Thank Jesus for being our Redeemer \u2014 the one who came near and paid our debt</li><li>Ask God to help us show that same loyal love to someone in our lives this week</li></ul><em>Close with something like:</em> \u201c\u2026may thankfulness be the song of our days. Amen.\u201d',
    music:{title:'Great Is Thy Faithfulness', artist:'Thomas Chisholm / Various artists', note:'A beloved hymn on the steadfast covenant faithfulness of God \u2014 ideal for closing this session.', url:'https://www.youtube.com/results?search_query=great+is+thy+faithfulness+hymn'},
    p1:'<p>A woman named Eleanor, now in her late eighties, tells of a winter in her forties when her husband lost his job, their savings ran dry, and she quietly stopped eating full meals so the children would have enough. She never told anyone. One morning, anonymously, a full month of groceries appeared on her porch. She never found out who left them. Decades later, her eyes still mist: \u201cSomeone saw us. God saw us.\u201d</p><p>That is hesed \u2014 the Hebrew word at the heart of the book of Ruth. It is usually translated \u201csteadfast love\u201d or \u201clovingkindness,\u201d but neither phrase fully captures it. Hesed is loyal love that acts when it doesn\u2019t have to. The book of Ruth is set during the dark period of the Judges. Into that world comes Ruth, a Moabite widow, who clings to her Israelite mother-in-law Naomi against all common sense. Both women are destitute and without male protection. Ruth\u2019s loyalty to Naomi is itself hesed \u2014 she did not have to stay.</p><p>They arrive in Bethlehem at the start of the barley harvest. Ruth goes to glean in the fields. \u201cShe happened to come to the part of the field belonging to Boaz\u201d (Ruth 2:3). The narrator\u2019s gentle humor is intentional: there is no such thing as chance in a universe governed by a faithful God.</p>',
    p2:'<p>Boaz notices Ruth and hears her story \u2014 her loyalty to Naomi, her faith in Israel\u2019s God. He tells his workers to leave extra grain deliberately. He invites her to eat with the harvesters. He is doing more than the law requires; he is practicing hesed.</p><p>When Naomi hears who showed Ruth kindness, she cries out: <em>\u201cThe Lord has not forsaken his steadfast love [hesed] to the living and the dead!\u201d</em> (Ruth 2:20). She recognizes something: the kindness of Boaz is not separate from God\u2019s kindness. God\u2019s hesed arrives through human hands.</p><p>The story moves toward Boaz becoming Ruth\u2019s kinsman-redeemer \u2014 the family member who buys back what was lost and restores what was broken. He does so willingly, even at personal cost. In so doing, he becomes a picture of Christ: the one who saw our destitution, who was under no obligation except love, and who redeemed us at the price of himself. For those who have lived many years, Ruth\u2019s story is an invitation to look back and count the instances of hesed in your own story \u2014 the provision that arrived when you didn\u2019t see how, the person who stayed when they could have left. These are the hesed of a covenant God, and they are the deepest ground of our thankfulness.</p>',
    i1:{title:'Hesed in everyday life', text:'The story of Eleanor \u2014 groceries on a winter porch \u2014 captures the essence of hesed: loyal love that acts without calculation. Ask your group: where have you received hesed? Where have you given it?'},
    i2:{title:'The kinsman-redeemer and Christ', text:'In Ruth\u2019s world, the goel (kinsman-redeemer) was a legal role: a close relative who could buy back land or marry a widow to preserve the family line. The New Testament presents Christ as our ultimate Goel \u2014 fully human, who redeems what we lost and restores what sin destroyed.'}
,
    leaderIntro:'<p>Tonight we\u2019re moving from the New Testament back into the Old Testament \u2014 to a short, beautiful book that most people love but don\u2019t always know what to do with. The book of Ruth.</p> <p>On the surface, it\u2019s a story about two widows trying to survive. But underneath, it\u2019s one of the most stunning pictures of God\u2019s loyal love in all of Scripture. The Hebrew word at the center of this story is <em>hesed</em> \u2014 and it\u2019s a word worth knowing, because once you see it in Ruth, you\u2019ll start seeing it everywhere in your own life.</p> <p>Hesed is the kind of love that stays when it doesn\u2019t have to. It\u2019s the kind of kindness that goes further than anyone expected. It\u2019s what Ruth showed Naomi when she said, \u201cWherever you go, I will go.\u201d And it\u2019s what Boaz showed Ruth when he left extra grain in the field and said, \u201cI\u2019ve got you.\u201d</p> <p>Here\u2019s the question I want us to sit with tonight: Where have you experienced that kind of love? Not the love you earned or deserved \u2014 but the love that showed up anyway, through another person, at exactly the right moment?</p> <p>Because when you find your hesed story, I think you\u2019ll also find that God\u2019s fingerprints are all over it. Let\u2019s look at Ruth\u2019s story and find our own.</p>'  },
  {
    num:'Lesson 3', title:'The Ten Lepers: Only One Returned',
    subtitle:'Luke 17:11\u201319 \u2014 Grace received and the rarity of grateful hearts',
    date:'Monday, June 30, 2025', duration:'60 min', theme:'Returning to Give Thanks',
    verses:[
      {ref:'Luke 17:15\u201316 (ESV)', text:'Then one of them, when he saw that he was healed, turned back, praising God with a loud voice; and he fell on his face at Jesus\u2019s feet, giving him thanks.'},
      {ref:'Luke 17:17\u201318 (ESV)', text:'Then Jesus answered, \u2018Were not ten cleansed? Where are the nine? Was no one found to return and give praise to God except this foreigner?\u2019'},
      {ref:'Psalm 103:2 (ESV)', text:'Bless the Lord, O my soul, and forget not all his benefits.'}
    ],
    study:'<p>Of ten men healed of leprosy \u2014 a devastating, isolating disease \u2014 only one returned to give thanks. And that one was a Samaritan: an outsider, a foreigner, someone Jews of the day would have considered least likely to understand the grace of God.</p><p>This story cuts to the heart of the human condition. We receive grace upon grace \u2014 healing, provision, relationships, another morning \u2014 and we move on. The nine were not ungrateful villains; they were simply ordinary people absorbed in the relief of their restoration. Only one paused to trace the gift back to the Giver.</p><p>The Samaritan\u2019s return is a picture of what genuine thankfulness looks like \u2014 embodied, vocal, prostrate, specific. He did not send a polite nod; he fell on his face. This is a picture of what it looks like to live with a heart fully turned toward God \u2014 recognizing every gift, tracing it back to the Giver, and offering praise.</p>',
    illustration:{icon:'&#129309;', title:'Leprosy in the ancient world', body:'Leprosy rendered a person ritually unclean and socially exiled under Mosaic law (Leviticus 13\u201314). Lepers were required to cry \u2018Unclean!\u2019 and keep their distance. To be healed meant full restoration to family, community, worship, and society.'},
    application:'What has God healed, provided, or restored in your life that you may have \u2018moved on from\u2019 without fully returning to give thanks? Take a moment to name it \u2014 and then name it to God together in prayer.',
    questions:[
      {q:'Why do you think only one of the ten returned? What kept the others from coming back? What keeps us from returning to give thanks?', refs:['Luke 17:15','Ps 103:2','Deut 8:11\u201314']},
      {q:'What is significant about the fact that the thankful one was a Samaritan? What does this say about who truly understands grace?', refs:['Luke 17:16','Luke 10:33','Rom 9:25\u201326']},
      {q:'How does the discipline of gratitude reshape the way we see our daily lives and the gift of aging?', refs:['1 Thess 5:18','Phil 4:6\u20137']},
      {q:'Scripture says we were made to glorify God and enjoy Him. How does a life of thankfulness connect to both of those things?', refs:['Ps 86:12','Ps 100:4\u20135']}
    ],
    video:{title:'The Ten Lepers: A Study in Gratitude', desc:'A 12-minute devotional and contextual overview of Luke 17 \u2014 great for opening discussion.', url:'https://www.youtube.com/results?search_query=ten+lepers+luke+17+bible+study'},
    prayerOpen:'<em>Open with something like:</em> \u201cLord Jesus, we come tonight as people who have received so much from You\u2026\u201d<br><br><strong>Pray through these together:</strong><ul style=\"margin:0.5rem 0 0.5rem 1.25rem;line-height:2\"><li>Confess honestly that we often receive God\u2019s blessings and move on without stopping to give thanks</li><li>Ask God to open our eyes to the grace He has poured into our everyday lives</li><li>Thank Him for two or three specific blessings that come to mind right now</li><li>Ask for a spirit of genuine gratitude to grow in each person here</li></ul><em>Close with something like:</em> \u201c\u2026help us to always be the one who turns back to say thank You. Amen.\u201d',
    prayerClose:'<em>Open with something like:</em> \u201cFather, we don\u2019t want to be like the nine who forgot to return\u2026\u201d<br><br><strong>Pray through these together:</strong><ul style=\"margin:0.5rem 0 0.5rem 1.25rem;line-height:2\"><li>Spend a moment in silence letting each person quietly name a blessing to God</li><li>Ask God to make each of us more alert to His goodness in the coming week</li><li>Pray for a spirit of thankfulness to overflow into our homes and relationships</li></ul><em>Close with something like:</em> \u201c\u2026may we leave here as people who notice Your grace. In Jesus\u2019 name, Amen.\u201d',
    music:{title:'Count Your Blessings', artist:'Johnson Oatman Jr. / Gaither Vocal Band', note:'A classic hymn on intentional, practiced gratitude \u2014 familiar and singable for a senior adult group.', url:'https://www.youtube.com/results?search_query=count+your+blessings+hymn+gaither'},
    p1:'<p>A retired physician once described what he called \u201cthe nine o\u2019clock feeling.\u201d Every morning at nine, his phone used to ring with the day\u2019s first patient crisis \u2014 and for thirty years, he answered. When he retired, nine o\u2019clock became quiet. For weeks he felt vaguely uneasy at that hour. Then one morning it hit him: he had forgotten to simply be grateful for a morning that began in peace. \u201cI had received so many good mornings,\u201d he said, \u201cand never once stopped to thank anyone for them.\u201d</p><p>Ten men with leprosy stood at a distance from Jesus and cried out for mercy. Leprosy rendered a person ritually unclean under Mosaic law. Lepers lived outside of community, cut off from family, worship, and daily life. Jesus heals all ten and tells them to go show themselves to the priests. \u201cAnd as they went, they were cleansed\u201d (v.14). The miracle happens on the road. Ten men suddenly whole, suddenly restored, suddenly able to run toward everything the disease had taken from them. Nine of them kept running. Only one stopped and turned back.</p>',
    p2:'<p>That one \u2014 a Samaritan, doubly excluded \u2014 came back \u201cpraising God with a loud voice\u201d and \u201cfell on his face at Jesus\u2019s feet, giving him thanks\u201d (vv.15\u201316). Jesus asks the question that still hangs in the air: <em>\u201cWere not ten cleansed? Where are the nine?\u201d</em></p><p>It is not an angry question. It is a sad one. The nine received everything and gave nothing back \u2014 not because they were wicked, but because gratitude requires something the relief of healing doesn\u2019t automatically produce: the deliberate act of <em>turning back</em>.</p><p>Psalm 103:2 puts it plainly: <em>\u201cBless the Lord, O my soul, and forget not all his benefits.\u201d</em> Forgetting is our default. Gratitude is not natural \u2014 it is practiced. It requires the conscious decision to stop, turn, and trace the gift back to the Giver. For those who have lived long lives, the question is deeply personal. You have received healing \u2014 physical, relational, spiritual. The question is not whether you have received grace. The question is: have you turned back? Have you named it? Have you fallen at His feet? It is never too late to be the one who returned.</p>',
    i1:{title:'The nine o\u2019clock feeling', text:'The retired physician\u2019s story illustrates something universal: we can become so accustomed to grace that we stop noticing it. Ask your group: what \u2018ordinary mercies\u2019 have you received so consistently that you\u2019ve stopped seeing them as gifts?'},
    i2:{title:'Gratitude as a spiritual discipline', text:'Research consistently finds that people who regularly practice naming specific things they are grateful for report significantly higher wellbeing and resilience. What Scripture calls thankfulness and what science calls gratitude practice point to the same truth: counting our blessings is not sentimental \u2014 it is transformative.'}
,
    leaderIntro:'<p>Tonight\u2019s study starts with a number: ten. Ten men healed of leprosy on the same day, by the same word from Jesus. Ten men whose lives were completely turned around in a moment. And only one of them came back to say thank you.</p> <p>That ratio \u2014 one out of ten \u2014 shouldn\u2019t surprise us as much as it does. Because if we\u2019re honest, most of us recognize ourselves more in the nine than in the one.</p> <p>Not because we\u2019re ungrateful people. But because life has a way of pulling our attention forward \u2014 toward the next problem, the next appointment, the next thing we need. And before we know it, we\u2019ve received blessing after blessing from God and never stopped to trace those gifts back to the One who gave them.</p> <p>Jesus\u2019 question in this story is one of the gentlest and most convicting things He ever said: <em>\u201cWhere are the nine?\u201d</em> He\u2019s not angry. He\u2019s simply noting something true about the human heart \u2014 that gratitude doesn\u2019t come automatically. It has to be practiced. It has to be chosen.</p> <p>Tonight we\u2019re going to practice it together. We\u2019re going to slow down, look back, and count some blessings that might have been easy to miss. My hope is that every one of us leaves here feeling like the one who returned.</p>'  },
  {
    num:'Lesson 4', title:'Joseph: Mercy Forged Through Suffering',
    subtitle:'Genesis 45 & 50 \u2014 God\u2019s sovereign grace turning evil to good',
    date:'Monday, July 14, 2025', duration:'60 min', theme:'Providence & Redemptive Grace',
    verses:[
      {ref:'Genesis 45:7\u20138 (ESV)', text:'And God sent me before you to preserve for you a remnant on earth. So it was not you who sent me here, but God.'},
      {ref:'Genesis 50:20 (ESV)', text:'As for you, you meant evil against me, but God meant it for good, to bring it about that many people should be kept alive, as they are today.'},
      {ref:'Romans 8:28 (ESV)', text:'And we know that for those who love God all things work together for good, for those who are called according to his purpose.'}
    ],
    study:'<p>Few stories in Scripture more powerfully illustrate the intersection of human suffering and divine providence than the life of Joseph. Betrayed by his brothers, sold into slavery, falsely accused, imprisoned \u2014 and yet through every dark chapter, \u201cthe Lord was with Joseph.\u201d</p><p>The climax of Joseph\u2019s story is his words to his trembling brothers: <em>\u201cYou meant evil against me, but God meant it for good.\u201d</em> This is not na\u00efve optimism. It is the hard-won theology of a man who looked back over decades of pain and traced the hand of a sovereign God at work through all of it.</p><p>Scripture teaches that God does not cause evil, but that He is sovereign over all things \u2014 including the painful things people intend against us \u2014 and can weave them into His gracious purposes. The right response when we finally see this is awestruck, tearful gratitude.</p>',
    illustration:{icon:'&#128506;', title:'The pit to the palace', body:'Joseph\u2019s journey from beloved son (age 17) to Pharaoh\u2019s court (age 30) spans 13 years. Every \u2018setback\u2019 was a step in God\u2019s providential preparation. The years that felt like abandonment were the very years God was shaping the man who would save a nation.'},
    application:'Looking back over your life, can you identify a \u2018pit\u2019 \u2014 a moment of suffering or betrayal \u2014 through which you can now see God was working? What does His faithfulness through those seasons lead you to give thanks for today?',
    questions:[
      {q:'How do Joseph\u2019s words \u2018God meant it for good\u2019 speak to the biblical teaching that God is sovereign even over painful and evil things that happen in our lives?', refs:['Gen 50:20','Rom 8:28','Isa 46:9\u201310']},
      {q:'Joseph wept multiple times in these chapters. How does his emotional honesty challenge any idea that faith means denying suffering?', refs:['Gen 45:1\u20132','Gen 50:17','Ps 22:1\u20132']},
      {q:'How does Joseph\u2019s forgiveness of his brothers reflect the grace God has extended to us? What makes forgiveness possible?', refs:['Gen 45:15','Eph 4:32','Col 3:13']},
      {q:'What specific mercies \u2014 visible only in hindsight \u2014 can members of the group identify from their own lives?', refs:['Ps 77:11','Lam 3:21\u201323']}
    ],
    video:{title:'Joseph: Providence, Suffering, and Grace', desc:'A 13-minute overview of the Joseph narrative in Genesis, focusing on providence and its application to our lives.', url:'https://www.youtube.com/results?search_query=joseph+genesis+bible+study+suffering+providence'},
    prayerOpen:'<em>Open with something like:</em> \u201cLord, You are the God who is present in every season of our lives \u2014 even the ones that felt like a pit\u2026\u201d<br><br><strong>Pray through these together:</strong><ul style=\"margin:0.5rem 0 0.5rem 1.25rem;line-height:2\"><li>Acknowledge that God is present even in our darkest and most confusing chapters</li><li>Thank Him for times when He brought good out of something painful in your life</li><li>Pray for anyone in the group who is in a hard season right now \u2014 ask God to give them eyes of faith</li><li>Ask for open and honest conversation as we study Joseph\u2019s story tonight</li></ul><em>Close with something like:</em> \u201c\u2026we trust You even when we can\u2019t see You. In Jesus\u2019 name, Amen.\u201d',
    prayerClose:'<em>Open with something like:</em> \u201cFather, thank You that no chapter of our lives is outside Your care\u2026\u201d<br><br><strong>Pray through these together:</strong><ul style=\"margin:0.5rem 0 0.5rem 1.25rem;line-height:2\"><li>If anyone is comfortable, invite them to name a \u201cpit\u201d God brought them through</li><li>Give thanks together for God\u2019s faithfulness through hard seasons</li><li>Pray for the ability to trust God with the unknown chapters still ahead</li></ul><em>Close with something like:</em> \u201c\u2026You meant it for good. We trust You. In Jesus\u2019 name, Amen.\u201d',
    music:{title:'It Is Well with My Soul', artist:'Horatio Spafford / Various artists', note:'Written by a man who suffered devastating loss \u2014 a powerful close for a lesson on suffering and sovereign grace.', url:'https://www.youtube.com/results?search_query=it+is+well+with+my+soul+hymn'},
    p1:'<p>Corrie ten Boom was a Dutch watchmaker\u2019s daughter who, with her family, hid Jewish refugees during the Nazi occupation of Holland. When they were discovered, Corrie and her sister Betsie were sent to Ravenbr\u00fcck concentration camp. Betsie died there. Corrie survived. After the war, she traveled the world with one message: \u201cThere is no pit so deep that God\u2019s love is not deeper still.\u201d</p><p>Joseph of Egypt could have said the same thing centuries earlier. He is his father Jacob\u2019s favorite son, and his brothers resent it. When Joseph is seventeen, they seize him, throw him into a pit, and sell him to slave traders. In Egypt, Joseph rises to a position of trust \u2014 then is falsely accused and thrown into prison. He interprets dreams for two of Pharaoh\u2019s officials; the one who is released forgets him for two years. Thirteen years pass between the original betrayal and the moment Joseph stands before Pharaoh.</p>',
    p2:'<p>Pharaoh has dreams no one can interpret, and the cupbearer finally remembers Joseph. Joseph interprets them \u2014 seven years of plenty followed by seven years of famine \u2014 and Pharaoh elevates him to second-in-command over all of Egypt.</p><p>When famine strikes and Joseph\u2019s brothers come to Egypt for grain, they do not recognize him. Joseph recognizes them. He \u201cturned away from them and wept\u201d (Genesis 42:24). When he finally reveals himself, his words are stunning: <em>\u201cGod sent me before you to preserve life\u2026 it was not you who sent me here, but God\u201d</em> (Genesis 45:7\u20138). And later: <em>\u201cYou meant evil against me, but God meant it for good\u201d</em> (Genesis 50:20).</p><p>Like Corrie ten Boom, Joseph had reached the place where he could look back down the road of suffering and trace the hand of a God whose purposes were never derailed, whose mercy was never absent, even when it was invisible. Most of us in this room have lived long enough to have our own version of the pit. The question Joseph\u2019s story asks is not whether God was present in yours \u2014 but whether you have yet seen it. And whether that seeing has moved you to thankfulness.</p>',
    i1:{title:'Corrie ten Boom and the deeper pit', text:'Corrie\u2019s story mirrors Joseph\u2019s: unjust suffering, years of imprisonment, and a release that led to a ministry of forgiveness. Her line \u2014 \u201cno pit so deep that God\u2019s love is not deeper still\u201d \u2014 is a contemporary commentary on Genesis 50:20.'},
    i2:{title:'Providence is not always visible forward', text:'Joseph was not spared the pit \u2014 he was preserved through it. Providence rarely announces itself in the moment of suffering. It is most often recognized in retrospect. That is why the people best positioned to see it most clearly are often those who have lived the longest.'}
,
    leaderIntro:'<p>Tonight\u2019s study covers one of the most dramatic lives in all of the Bible \u2014 a man who went from his father\u2019s favorite to a slave to a prisoner to the second most powerful person in Egypt. His name is Joseph, and his story spans fourteen chapters of Genesis.</p> <p>But here\u2019s what I want you to notice as we get into it: Joseph\u2019s story is not primarily about Joseph. It\u2019s about God. Specifically, it\u2019s about what God can do with a life that has been through the worst.</p> <p>Most of us in this room have lived long enough to have our own version of the pit. A season that didn\u2019t make sense. A loss that seemed senseless. A betrayal you didn\u2019t see coming. A door that closed when you thought it was going to open.</p> <p>What Joseph\u2019s story gives us is not easy answers \u2014 it doesn\u2019t pretend the pit wasn\u2019t real or painful. What it gives us is a long view. A view that says: God was present in that chapter too. And He was writing something you couldn\u2019t see yet.</p> <p>Joseph looked back over thirteen years of suffering and said, <em>\u201cYou meant it for evil. God meant it for good.\u201d</em> My prayer for tonight is that each of us might find a place in our own story where we can say something similar \u2014 and let that become the soil of deep, genuine thankfulness.</p>'  },
  {
    num:'Lesson 5', title:'The Woman at the Well: Grace for the Outcast',
    subtitle:'John 4:1\u201342 \u2014 Living water offered freely to the least expected',
    date:'Monday, July 28, 2025', duration:'60 min', theme:'Grace Without Precondition',
    verses:[
      {ref:'John 4:10 (ESV)', text:'Jesus answered her, \u2018If you knew the gift of God, and who it is that is saying to you, Give me a drink, you would have asked him, and he would have given you living water.\u2019'},
      {ref:'John 4:13\u201314 (ESV)', text:'Jesus said to her, \u2018Everyone who drinks of this water will be thirsty again, but whoever drinks of the water that I will give him will never be thirsty again.\u2019'},
      {ref:'Isaiah 55:1 (ESV)', text:'Come, everyone who thirsts, come to the waters; and he who has no money, come, buy and eat! Come, buy wine and milk without money and without price.'}
    ],
    study:'<p>Jesus\u2019s encounter at Jacob\u2019s Well breaks every social rule of first-century Jewish life. He speaks to a woman \u2014 countercultural. She is a Samaritan \u2014 ethnically despised. She has had five husbands and lives with a man outside of marriage \u2014 morally ostracized. She comes to the well at noon precisely to avoid others. She is, in every sense, an outcast.</p><p>And yet Jesus waits for her. He asks her for water \u2014 an act of deliberate vulnerability and solidarity. He engages her in one of the longest theological conversations in the Gospels, offers her living water, reveals her history without condemnation, and identifies himself as the Messiah \u2014 to her, before almost anyone else.</p><p>TGod19s electing grace is not based on anything foreseen in the creature \u2014 no worthiness, no merit, no social standing. She brought nothing to the well but her thirst \u2014 and that was exactly enough.</p>',
    illustration:{icon:'&#128167;', title:'Jacob\u2019s Well in Samaria', body:'Jacob\u2019s Well (modern-day Nablus) is approximately 100 feet deep and still draws water today. That Jesus asked a Samaritan woman for a drink was so countercultural that the disciples marveled when they returned (John 4:27).'},
    application:'Where in your life have you come to a \u2018well\u2019 in isolation \u2014 carrying something you thought disqualified you from God\u2019s grace? How does the woman\u2019s story speak to you?',
    questions:[
      {q:'What barriers \u2014 social, moral, ethnic \u2014 did Jesus cross to speak with this woman? What does this say about the reach of God\u2019s grace?', refs:['John 4:9','John 4:27','Gal 3:28']},
      {q:'Jesus said \u2018If you knew the gift of God\u2026\u2019 \u2014 she did not know. How does this connect to the teaching that God\u2019s grace reaches us before we seek it?', refs:['John 4:10','Rom 5:8','Eph 2:8\u20139']},
      {q:'The woman left her water jar and ran to tell others. What is it about an encounter with grace that compels us to share it?', refs:['John 4:28\u201329','Ps 66:16']},
      {q:'How does Isaiah 55:1 \u2014 \u2018come without money, without price\u2019 \u2014 illuminate the free grace Jesus offers? How does this challenge any sense that we must earn our standing with God?', refs:['Isa 55:1','John 4:14','Rev 22:17']}
    ],
    video:{title:'The Woman at the Well: A Deep Encounter', desc:'An 11-minute devotional and cultural introduction to John 4 \u2014 ideal for setting the scene.', url:'https://www.youtube.com/results?search_query=woman+at+the+well+john+4+bible+study'},
    prayerOpen:'<em>Open with something like:</em> \u201cLord Jesus, You have a habit of meeting people right where they are\u2026\u201d<br><br><strong>Pray through these together:</strong><ul style=\"margin:0.5rem 0 0.5rem 1.25rem;line-height:2\"><li>Thank God that He meets us exactly where we are \u2014 no pretending required</li><li>Ask Him to speak personally to each person in the room through His Word tonight</li><li>Pray for anyone who may feel unworthy or distant from God right now</li><li>Ask for the Holy Spirit to guide the discussion and make it personal and real</li></ul><em>Close with something like:</em> \u201c\u2026give us the living water only You can give. In Your name, Amen.\u201d',
    prayerClose:'<em>Open with something like:</em> \u201cFather, like the woman at the well, we came here tonight with our own burdens\u2026\u201d<br><br><strong>Pray through these together:</strong><ul style=\"margin:0.5rem 0 0.5rem 1.25rem;line-height:2\"><li>Thank God that He offers grace freely \u2014 not to those who deserve it, but to those who need it</li><li>Ask Him to help each person leave something behind tonight \u2014 like the woman left her water jar</li><li>Pray for courage to share the grace we\u2019ve received with someone in our lives this week</li></ul><em>Close with something like:</em> \u201c\u2026may thankfulness overflow from us to others. In Jesus\u2019 name, Amen.\u201d',
    music:{title:'Fill My Cup, Lord', artist:'Richard Blanchard / Various', note:'A gentle, familiar hymn connecting directly to the living water theme of John 4.', url:'https://www.youtube.com/results?search_query=fill+my+cup+lord+hymn'},
    p1:'<p>A chaplain at a women\u2019s correctional facility tells of a woman she visited regularly \u2014 convicted, serving a long sentence, convinced she was beyond the reach of anything good. The chaplain kept coming. One day the woman said, \u201cWhy do you keep coming back? I have nothing to offer you.\u201d The chaplain replied simply: \u201cNeither did the woman at the well.\u201d That was the day everything changed.</p><p>John 4 opens with Jesus traveling through Samaria. He stops at a well outside the town of Sychar, tired from the journey. It is noon. A woman comes alone to draw water. The detail of noon is significant \u2014 women drew water in the cooler morning hours, together. Coming alone at midday was the signature of someone who did not want to be seen. She has had five husbands. She now lives with a man who is not her husband. She carries what she carries, alone.</p>',
    p2:'<p>Jesus asks her for a drink \u2014 shocking on multiple levels. Jewish men did not speak publicly to women; Jews did not share vessels with Samaritans. What follows is one of the longest one-on-one conversations Jesus has with anyone in the Gospels. He offers her \u201cliving water\u201d \u2014 a spring welling up inside a person that satisfies the thirst no earthly drink can touch.</p><p>He knows her history. He names it \u2014 not to condemn, but to show that he sees her fully and chooses her anyway. He identifies himself, to her, as the Messiah. She leaves her water jar \u2014 the very thing she came for \u2014 and runs into town: \u201cCome, see a man who told me all that I ever did.\u201d The woman who came to the well to be invisible becomes the first evangelist in Samaria. Her shame becomes her testimony. Her thirst becomes her message.</p><p>Isaiah 55:1 had declared it centuries before: <em>\u201cCome, everyone who thirsts\u2026 without price.\u201d</em> The only qualification is need. The only currency is thirst. The chaplain\u2019s words echo the gospel: Jesus keeps coming back. Not because we have something to offer. Because He has something to give \u2014 to those who have run out of everything else.</p>',
    i1:{title:'The chaplain and the prisoner', text:'The story captures the heart of John 4: grace that seeks out the isolated, the ashamed, the ones who come alone at noon. Ask your group: have you ever felt like that woman \u2014 convinced you had nothing to offer? What did it mean to encounter grace in that moment?'},
    i2:{title:'The left-behind water jar', text:'The woman\u2019s abandoned water jar is one of the most evocative details in John\u2019s Gospel. She came for water; she found something that made the water jar irrelevant. When genuine grace is received, priorities re-order. What \u2018water jar\u2019 has grace caused you to set down?'}
,
    leaderIntro:'<p>I want to ask you something before we get started tonight: Have you ever felt like you didn\u2019t quite belong? Like if people really knew your story \u2014 really knew everything \u2014 they might keep their distance?</p> <p>If so, then tonight\u2019s passage was written for you. Because the woman Jesus meets at a well in John chapter 4 is someone who has spent years feeling exactly that way. She comes to draw water alone, at noon, in the hottest part of the day \u2014 specifically to avoid other people. She\u2019s an outsider in every possible sense.</p> <p>And yet Jesus is waiting for her. Not to confront her. Not to correct her. To offer her something she\u2019s never had before \u2014 what He calls \u201cliving water.\u201d Water that doesn\u2019t run out. A grace that fills the places inside us that nothing else has been able to reach.</p> <p>What I love about this story is how Jesus handles her past. He doesn\u2019t pretend it isn\u2019t there. He sees it clearly \u2014 and then offers grace anyway. Actually, I think He sees it clearly <em>in order to</em> offer grace. Because grace that doesn\u2019t know your real story isn\u2019t really grace.</p> <p>Tonight we\u2019re going to sit at that well with her. And I think if we\u2019re honest, most of us will find something of ourselves in her story \u2014 and something of God\u2019s grace that we haven\u2019t fully received yet.</p>'  },
  {
    num:'Lesson 6', title:'The Psalms of Ascent: Pilgrims Giving Thanks',
    subtitle:'Psalms 120\u2013134 \u2014 Songs of a people grateful to arrive in God\u2019s presence',
    date:'Monday, August 11, 2025', duration:'60 min', theme:'Gratitude as a Way of Life',
    verses:[
      {ref:'Psalm 121:1\u20132 (ESV)', text:'I lift up my eyes to the hills. From where does my help come? My help comes from the Lord, who made heaven and earth.'},
      {ref:'Psalm 126:3 (ESV)', text:'The Lord has done great things for us; we are glad.'},
      {ref:'Psalm 134:1\u20132 (ESV)', text:'Come, bless the Lord, all you servants of the Lord! Lift up your hands to the holy place and bless the Lord!'}
    ],
    study:'<p>The fifteen Psalms of Ascent (120\u2013134) were sung by pilgrims making the journey up to Jerusalem for the great feasts \u2014 Passover, Pentecost, Tabernacles. They are road songs, songs of a people practicing thankfulness as a discipline of the journey itself.</p><p>For a senior adult group gathered in a home, these psalms offer a beautiful mirror. The life of faith is a pilgrimage \u2014 and those who have traveled longest have the richest story of God\u2019s faithfulness along the way. Psalm 126 captures this: \u201cThe Lord has done great things for us; we are glad.\u201d The Hebrew implies ongoing gladness rooted in the memory of God\u2019s acts.</p><p>This lesson explores gratitude not as an occasional feeling, but as a <strong>posture of the whole life</strong> \u2014 a way of walking the road with eyes lifted up.</p>',
    illustration:{icon:'&#9968;', title:'The ascent to Jerusalem', body:'Jerusalem sits at approximately 2,500 feet elevation. Pilgrims would literally ascend \u2014 sometimes 3,000\u20134,000 feet over the journey. The singing of these psalms transformed the physical climb into a spiritual one. By the time pilgrims arrived, they had been shaped by gratitude and praise.'},
    application:'What does your own \u2018ascent\u2019 \u2014 your journey of faith across many decades \u2014 look like? What are the \u2018great things the Lord has done\u2019 that you would name for those in the group?',
    questions:[
      {q:'Psalm 121 begins: \u2018From where does my help come?\u2019 What has been your answer to that question across your life? How has it changed?', refs:['Ps 121:1\u20132','Ps 46:1','Heb 13:6']},
      {q:'The pilgrims sang these psalms together on the road. What is the role of community in sustaining a life of thankfulness?', refs:['Ps 122:1','Heb 10:24\u201325','Col 3:16']},
      {q:'Psalm 126 speaks of those who \u2018sow in tears\u2019 but \u2018reap in joy.\u2019 How does this speak to seasons of your life that felt like sowing without seeing a harvest?', refs:['Ps 126:5\u20136','Gal 6:9','Isa 61:3']},
      {q:'Why do you think Scripture connects gratitude so closely with grace? What does it say about God that He desires our thankfulness \u2014 not as a way to earn favor, but as a natural response to His love?', refs:['1 Thess 5:18','Rom 12:1\u20132','1 Thess 5:18']}
    ],
    video:{title:'Psalms of Ascent: Songs for the Journey', desc:'A 12-minute introduction to the Psalms of Ascent and their use in Israelite pilgrimage worship.', url:'https://www.youtube.com/results?search_query=psalms+of+ascent+bible+study+pilgrimage'},
    prayerOpen:'<em>Open with something like:</em> \u201cLord, You have walked every mile of this journey with us\u2026\u201d<br><br><strong>Pray through these together:</strong><ul style=\"margin:0.5rem 0 0.5rem 1.25rem;line-height:2\"><li>Thank God for the specific road He has brought each of you down to get to this moment</li><li>Ask Him to stir up memories of His faithfulness as you study the psalms tonight</li><li>Pray for this group \u2014 that it would be a community of people who lift one another up on the journey</li><li>Ask for fresh gratitude, even for blessings that have become ordinary and easy to overlook</li></ul><em>Close with something like:</em> \u201c\u2026You have been our help. We lift our eyes to You. Amen.\u201d',
    prayerClose:'<em>Open with something like:</em> \u201cFather, like the pilgrims climbing toward Jerusalem, we leave here encouraged\u2026\u201d<br><br><strong>Pray through these together:</strong><ul style=\"margin:0.5rem 0 0.5rem 1.25rem;line-height:2\"><li>Invite anyone who wants to name one \u201cgreat thing the Lord has done\u201d in their life</li><li>Thank God for this group and the road you\u2019re walking together</li><li>Ask Him to keep the spirit of gratitude alive between now and the next time you meet</li></ul><em>Close with something like:</em> \u201c\u2026send us home with songs in our hearts. In Christ\u2019s name, Amen.\u201d',
    music:{title:'To God Be the Glory', artist:'Fanny Crosby / Various', note:'A triumphant doxological hymn \u2014 a fitting close for a session on pilgrimage and gratitude.', url:'https://www.youtube.com/results?search_query=to+god+be+the+glory+fanny+crosby+hymn'},
    p1:'<p>An elderly man in his nineties, a lifelong churchgoer, was asked near the end of his life what he would tell younger people about faith. He thought for a long moment and said: \u201cKeep singing. Whatever else you do \u2014 keep singing. The songs will carry you when the words run out.\u201d He had, without knowing it, described the Psalms of Ascent.</p><p>The fifteen psalms numbered 120 through 134 were sung by Jewish pilgrims making their way up to Jerusalem for the three great annual festivals. The journey was long and often difficult. Pilgrims traveled in groups, and these psalms were the songs they sang on the road. The singing was not background music \u2014 it was the practice that transformed the physical climb into a spiritual one. By the time they arrived, they had been shaped by the words they had been singing.</p><p>Psalm 121 opens with a question: <em>\u201cI lift up my eyes to the hills. From where does my help come?\u201d</em> The answer arrives immediately: <em>\u201cMy help comes from the Lord, who made heaven and earth.\u201d</em> This is the pilgrim\u2019s orientation \u2014 eyes lifted, help acknowledged.</p>',
    p2:'<p>Psalm 126 captures something essential about grateful memory. It recalls a great deliverance and makes the move that gratitude always makes \u2014 from memory to present declaration: <em>\u201cThe Lord has done great things for us; we are glad\u201d</em> (v.3). It ends with one of Scripture\u2019s most beautiful promises: <em>\u201cThose who sow in tears shall reap with shouts of joy!\u201d</em> (vv.5\u20136).</p><p>For a senior adult group gathered in a home, these psalms offer an immediate mirror. You are pilgrims who have been on the road for a long time. You have climbed. You have sung in the easy stretches and in the hard ones. You have known seasons of sowing in tears \u2014 grief, illness, loss \u2014 and seasons of reaping with joy.</p><p>The invitation is to do what the pilgrims did: gather in community, lift your eyes, and rehearse together the great things the Lord has done. Not because the journey is over, but because the singing is what makes the journey possible. The elderly man was right. Keep singing. The songs will carry you when the words run out \u2014 and they will bring you, at last, all the way home.</p>',
    i1:{title:'Keep singing: the power of communal song', text:'Research on resilience in aging consistently highlights the role of meaningful community and shared ritual. This group, gathered every other Monday in a home, is itself a small pilgrimage company. The singing you do here \u2014 in study, in prayer, in the closing hymn \u2014 is doing something the psalms understood long ago.'},
    i2:{title:'Sowing in tears, reaping in joy', text:'Many in your group will have lived through seasons that felt like \u2018sowing in tears.\u2019 Psalm 126:5\u20136 does not promise the tears were not real. It promises that what was sown in them will bear fruit. Ask your group: where have you seen the harvest of something sown in tears?'}
,
    leaderIntro:'<p>We\u2019re coming into the home stretch of our study together, and tonight we\u2019re doing something a little different. Instead of one story from one person\u2019s life, we\u2019re going to look at a collection of songs \u2014 fifteen short psalms that Jewish pilgrims sang as they made their way up to Jerusalem for worship.</p> <p>They\u2019re called the Psalms of Ascent, and they\u2019ve been described as the world\u2019s oldest road trip playlist.</p> <p>The pilgrims who sang these songs were ordinary people \u2014 farmers and merchants and families \u2014 making a long, sometimes difficult journey to be in God\u2019s presence. And as they walked, they sang. They sang about where their help came from. They sang about what God had done. They sang when they were tired and when they were joyful and when they were almost there.</p> <p>Here\u2019s why I think these psalms belong in our study: every one of us in this room is on a pilgrimage. We\u2019ve been walking this road for a long time \u2014 through easy seasons and hard ones, through harvest and through famine. And one of the gifts of being further along in the journey is that you have more road to look back on. More evidence of God\u2019s faithfulness. More stories of how He showed up.</p> <p>Tonight I want us to tell some of those stories. And I want us to do what the pilgrims did \u2014 lift our eyes, name the gifts, and let gratitude be the song we carry home.</p>'  },
  {
    num:'Lesson 7', title:'Doxology: All of Grace \u2014 A Life of Thankfulness',
    subtitle:'Romans 11:33\u201336 & Ephesians 1:3\u201314 \u2014 The eternal source and final end of all thanksgiving',
    date:'Monday, August 25, 2025', duration:'60 min', theme:'Soli Deo Gloria',
    verses:[
      {ref:'Romans 11:33 (ESV)', text:'Oh, the depth of the riches and wisdom and knowledge of God! How unsearchable are his judgments and how inscrutable his ways!'},
      {ref:'Romans 11:36 (ESV)', text:'For from him and through him and to him are all things. To him be glory forever. Amen.'},
      {ref:'Ephesians 1:3 (ESV)', text:'Blessed be the God and Father of our Lord Jesus Christ, who has blessed us in Christ with every spiritual blessing in the heavenly places.'}
    ],
    study:'<p>We arrive at the final lesson having walked through seven portraits of God\u2019s grace. Now Paul gives us the theological summit from which we can see all of it in perspective.</p><p>Romans 11:33\u201336 is Paul\u2019s eruption of praise after three chapters wrestling with the deepest mysteries of election, Israel, and salvation. He does not resolve all the tensions \u2014 he dissolves into worship. The appropriate response to the depth of God\u2019s wisdom and grace is not a syllogism but a doxology: <em>\u201cTo him be glory forever.\u201d</em></p><p>Ephesians 1:3\u201314 \u2014 one long, breathless sentence in the Greek \u2014 traces the arc of God\u2019s grace from before the foundation of the world to the final redemption of all things, with everything to the praise of His glory. Thankfulness is not a feeling we generate; it is the natural response of creatures who begin to see what God has done.</p>',
    illustration:{icon:'&#8734;', title:'From him, through him, to him', body:'Romans 11:36 captures the entire arc of reality in three prepositions: \u2018from him\u2019 (God is the source), \u2018through him\u2019 (God is the sustainer), \u2018to him\u2019 (God is the end). Thankfulness is our participation in that return to God\u2019s glory.'},
    application:'As you look back over these seven studies \u2014 and over your whole life \u2014 what is the one grace, the one mercy, that most fills you with thankfulness today? Share these with one another. Let this final session be a doxology.',
    questions:[
      {q:'Paul breaks into worship in the middle of his most difficult theological argument. What does this teach us about the relationship between doctrine and doxology?', refs:['Rom 11:33\u201336','Ps 119:64','Job 38\u201339']},
      {q:'Ephesians 1 says we were chosen \u2018before the foundation of the world\u2019 and sealed with the Spirit as a guarantee of our inheritance. How does this long view of grace fuel present thankfulness?', refs:['Eph 1:3\u201314','2 Tim 1:9','Rev 5:9\u201310']},
      {q:'After seven sessions together, which portrait of God\u2019s grace has most struck you? Which story resonates most deeply with your own?', refs:['Ps 107:1\u20133','Lam 3:22\u201323']},
      {q:'After these seven sessions together, how would you finish this sentence: \u2018Because of God\u2019s grace and mercy, I am most thankful for\u2026\u2019 How has this study changed or deepened your thankfulness?', refs:['Rom 8:38-39','1 Thess 5:18','1 Cor 15:57']}
    ],
    video:{title:'Soli Deo Gloria: The Doxology of the Redeemed', desc:'A 14-minute devotional on Romans 11:33\u201336 and the life of praise \u2014 designed to close a study series with wonder and worship.', url:'https://www.youtube.com/results?search_query=romans+11+doxology+soli+deo+gloria+bible+study'},
    prayerOpen:'<em>Open with something like:</em> \u201cFather, we come tonight to the end of our journey together through these seven studies\u2026\u201d<br><br><strong>Pray through these together:</strong><ul style=\"margin:0.5rem 0 0.5rem 1.25rem;line-height:2\"><li>Thank God for every evening you\u2019ve spent together in this study</li><li>Ask Him to seal in each person\u2019s heart the specific truth or story that meant the most to them</li><li>Pray that the spirit of thankfulness developed in this study would continue to grow</li><li>Ask God to show each person how to share what they\u2019ve learned with someone outside this group</li></ul><em>Close with something like:</em> \u201c\u2026all glory belongs to You. In Jesus\u2019 name, Amen.\u201d',
    prayerClose:'<em>Open with something like:</em> \u201cLord, we simply cannot find the words to thank You the way You deserve\u2026\u201d<br><br><strong>Pray through these together:</strong><ul style=\"margin:0.5rem 0 0.5rem 1.25rem;line-height:2\"><li>Go around the room and invite each person to finish this sentence in prayer: \u201cLord, I am most thankful for\u2026\u201d</li><li>Thank Jesus for the grace that runs through every story you\u2019ve studied \u2014 the prodigal\u2019s welcome, Ruth\u2019s field, the leper who returned, Joseph\u2019s road, the woman\u2019s water jar, the pilgrim\u2019s song</li><li>Ask God to keep each person held in His grace until you meet again \u2014 here or in heaven</li></ul><em>Close by singing or reading the Doxology together:</em> \u201cPraise God from whom all blessings flow\u2026\u201d',
    music:{title:'Doxology \u2014 Praise God From Whom All Blessings Flow', artist:'Thomas Ken / Various', note:'The ancient doxology \u2014 the perfect, eternal close to a study on thankfulness to God.', url:'https://www.youtube.com/results?search_query=doxology+praise+god+from+whom+all+blessings+flow+hymn'},
    p1:'<p>There is a tradition, observed in many congregations for centuries, of ending every service with a single sung verse: <em>\u201cPraise God from whom all blessings flow / Praise Him all creatures here below / Praise Him above ye heavenly host / Praise Father, Son, and Holy Ghost.\u201d</em> Four lines. Thirty-three words. The entire Christian life summarized.</p><p>Thomas Ken wrote the Doxology in 1674 as a morning hymn for students at Winchester College. It has outlived every controversy of the centuries since. It endures because it does the one thing that all theology, if it is working properly, eventually does: it falls down before God and says, simply, <em>to You be glory.</em></p><p>That is where Paul arrives in Romans 11. After three chapters wrestling with the hardest questions in Christian theology, he erupts: <em>\u201cOh, the depth of the riches and wisdom and knowledge of God! How unsearchable are his judgments and how inscrutable his ways!\u201d</em> The appropriate response to the depth of God\u2019s grace is not a conclusion \u2014 it is a doxology.</p>',
    p2:'<p>Ephesians 1:3\u201314 traces the arc of grace from eternity past to eternity future. Paul begins before creation: we were chosen \u201cbefore the foundation of the world\u201d (v.4). He ends beyond history: the Holy Spirit is the \u201cguarantee of our inheritance\u201d (v.14). And the refrain, repeated three times: <em>to the praise of his glory</em> (vv.6, 12, 14).</p><p>This is thankfulness at its fullest: not a feeling we manage or manufacture, but the natural, joyful response of a heart that has begun to see what God has truly done for us. The more clearly we see grace \u2014 in the prodigal\u2019s welcome, in Ruth\u2019s gleaning field, in the one leper who turned back, in Joseph\u2019s long road through the pit, in the woman\u2019s abandoned water jar, in the pilgrim\u2019s ascending song \u2014 the more naturally we fall into worship.</p><p>The invitation is to do what Paul did at the end of Romans 11: stop trying to resolve everything, and simply bow. Name the grace. Name the mercy. Name what God has done in your life across all these years. And then let the Doxology do what it has always done \u2014 carry the weight of gratitude that words alone cannot hold. <em>Praise God from whom all blessings flow.</em></p>',
    i1:{title:'The Doxology at Winchester College', text:'Ken\u2019s Doxology was a practical solution: how do students end each day well? His answer \u2014 by giving glory to God \u2014 has proved to be one of the most enduring pieces of Christian writing in history. Ask your group: what simple, repeated acts of gratitude have marked your own life of faith?'},
    i2:{title:'From him, through him, to him', text:'The three prepositions of Romans 11:36 capture the whole of Christian existence. We came from God (created, chosen, loved before time). We live through God (sustained, guided, forgiven, held). We are moving toward God (our final home, our ultimate joy). Thankfulness is what it feels like to know where you came from, who is carrying you, and where you are going.'}
,
    leaderIntro:'<p>Well, here we are. Our last session together in this study on thankfulness \u2014 and I have to say, what a journey it\u2019s been.</p> <p>We\u2019ve sat at the feet of a father who ran down a road to meet his prodigal son. We\u2019ve walked through a harvest field with Ruth and watched a man named Boaz practice a love that went beyond what was required. We\u2019ve stood with a Samaritan leper who turned back when nine others kept walking. We\u2019ve traced God\u2019s hand through thirteen years of Joseph\u2019s suffering. We\u2019ve drawn water beside a woman who didn\u2019t expect to find grace at a well. And we\u2019ve climbed the road to Jerusalem together with a group of pilgrims singing their way home.</p> <p>Tonight we end where all of it was always heading \u2014 with a doxology. A word of pure praise.</p> <p>The Apostle Paul, after wrestling with some of the deepest questions in all of theology, finally just throws up his hands and says: <em>\u201cOh, the depth of the riches and wisdom and knowledge of God!\u201d</em> He doesn\u2019t resolve everything. He dissolves into worship. And I think that\u2019s exactly the right response to a God whose grace is this big.</p> <p>Tonight I want us to do the same thing. I want us to name the grace. Tell the stories. Say out loud what we\u2019re thankful for. And then close \u2014 together \u2014 with the simplest, most enduring act of gratitude the church has ever known: the Doxology.</p> <p><em>Let\u2019s finish well.</em></p>'  }
];

var currentLesson = 0;
var currentPanel  = 'study';

function selectLesson(i) {
  currentLesson = i;
  currentPanel  = 'study';
  document.querySelectorAll('.lesson-btn').forEach(function(b,idx){ b.classList.toggle('active', idx===i); });
  buildPage();
  window.scrollTo({top:0, behavior:'smooth'});
}

function selectPanel(p) {
  currentPanel = p;
  document.querySelectorAll('.panel').forEach(function(el){ el.classList.remove('active'); });
  document.querySelectorAll('.stab').forEach(function(b){ b.classList.toggle('active', b.dataset.panel===p); });
  var el = document.getElementById('panel-'+p);
  if(el) el.classList.add('active');
  if(p==='notes') restoreNotes();
}

// ── Notes (in-memory per lesson) ──────────────────────────────
function saveNotes() {
  var ta = document.getElementById('nta');
  if(!ta) return;
  if(!notesData[currentLesson]) notesData[currentLesson]={text:'',links:[]};
  notesData[currentLesson].text = ta.value;
  var st = document.getElementById('nst');
  if(st){ st.textContent='\u2713 Saved'; setTimeout(function(){ st.textContent=''; },2000); }
}
function clearNotes() {
  if(!confirm('Clear notes and links for this lesson?')) return;
  notesData[currentLesson]={text:'',links:[]};
  var ta=document.getElementById('nta'); if(ta) ta.value='';
  rebuildLinks();
}
function addLink() {
  var u=document.getElementById('nurli'), l=document.getElementById('nlabl');
  if(!u) return;
  var url=u.value.trim();
  if(!url){ u.focus(); return; }
  if(!/^https?:\/\//i.test(url)) url='https://'+url;
  var lbl=l.value.trim()||url;
  if(!notesData[currentLesson]) notesData[currentLesson]={text:'',links:[]};
  notesData[currentLesson].links.push({url:url,label:lbl});
  u.value=''; l.value=''; u.focus();
  rebuildLinks();
}
function delLink(i) {
  if(notesData[currentLesson]&&notesData[currentLesson].links) notesData[currentLesson].links.splice(i,1);
  rebuildLinks();
}
function rebuildLinks() {
  var list=document.getElementById('nlst'); if(!list) return;
  var links=(notesData[currentLesson]||{}).links||[];
  list.innerHTML='';
  if(links.length===0){
    list.innerHTML='<p style="font-size:12px;color:#6b5d45;font-style:italic;padding:4px 0">No links saved yet.</p>';
    return;
  }
  links.forEach(function(lk,i){
    var d=document.createElement('div');
    d.className='link-item';
    d.innerHTML='<a href="'+lk.url+'" target="_blank" rel="noopener">'+lk.label+'</a>'+
      '<button class="link-del" onclick="delLink('+i+')" title="Remove">&times;</button>';
    list.appendChild(d);
  });
}
function restoreNotes() {
  var ta=document.getElementById('nta');
  if(ta) ta.value=(notesData[currentLesson]||{}).text||'';
  rebuildLinks();
}
function onEnterLink(e){ if(e.key==='Enter') addLink(); }

// ── Big screen display ────────────────────────────────────────
function showBigScreen(ref, text) {
  document.getElementById('bsRef').textContent = ref;
  document.getElementById('bsText').textContent = text;
  document.getElementById('bsOverlay').classList.add('open');
  document.addEventListener('keydown', onBsKey);
}
function closeBigScreen() {
  document.getElementById('bsOverlay').classList.remove('open');
  document.removeEventListener('keydown', onBsKey);
}
function onBsKey(e){ if(e.key==='Escape') closeBigScreen(); }
