  discuss.innerHTML =
    '<div class="card"><div class="card-title">&#128172; Group discussion questions</div>'+qhtml+
    '<p style="font-size:13px;color:#6b5d45;margin-top:.75rem;line-height:1.6">Allow 25&ndash;30 minutes for discussion. Blue references open the ESV passage on BibleGateway.</p></div>';

  // Prayer panel
  var prayer = document.createElement('div');
  prayer.id = 'panel-prayer';
  prayer.className = 'panel' + (currentPanel==='prayer' ? ' active' : '');
  prayer.innerHTML =
    '<div class="prayer-block"><div class="prayer-label">&#9728; Opening prayer &mdash; guide for the person praying</div><div class="prayer-text" style="font-style:normal;line-height:1.9">'+l.prayerOpen+'</div></div>'+
    '<div class="prayer-block"><div class="prayer-label">&#9790; Closing prayer &mdash; guide for the person praying</div><div class="prayer-text" style="font-style:normal;line-height:1.9">'+l.prayerClose+'</div></div>';

  // Music panel
  var music = document.createElement('div');
  music.id = 'panel-music';
  music.className = 'panel' + (currentPanel==='music' ? ' active' : '');
  music.innerHTML =
    '<div class="card"><div class="card-title">&#9835; Closing hymn or song</div>'+
    '<div class="music-card"><div class="music-icon">&#9835;</div>'+
    '<div class="music-info"><h3>'+l.music.title+'</h3><div class="music-artist">'+l.music.artist+'</div>'+
    '<div class="music-note">'+l.music.note+'</div>'+
    '<a class="music-btn" href="'+l.music.url+'" target="_blank" rel="noopener">&#8599; Find on YouTube</a></div></div>'+
    '<p style="font-size:13px;color:#6b5d45;margin-top:.75rem;line-height:1.6">Use this as the final 5 minutes of the session &mdash; a musical doxology to close the evening.</p></div>';

  // Print panel
  var print = document.createElement('div');
  print.id = 'panel-print';
  print.className = 'panel' + (currentPanel==='print' ? ' active' : '');
  var pv = l.verses.slice(0,1).map(function(v){
    return '<div class="print-verse"><div class="print-vref">'+v.ref+'</div><div class="print-vtext">'+v.text+'</div></div>';
  }).join('');
  var pqs = l.questions.map(function(q,i){
    return '<div class="print-q"><div class="print-qnum">Question '+(i+1)+'</div><div class="print-qtext">'+q.q+'</div></div>';
  }).join('');
  print.innerHTML =
    '<div class="card"><div class="card-title">&#128424; Printable take-home study</div>'+
    '<div class="print-preview">'+
    '<div class="print-hdr"><h2>'+l.title+'</h2><span>'+l.num+' &middot; Double-sided 8&frac12;&times;11</span></div>'+
    '<div class="print-slabel">Key verse</div>'+pv+
    '<div class="print-slabel">Page 1 &mdash; Study</div>'+
    '<div class="print-body">'+l.p1+'</div>'+
    '<div class="print-illus"><div class="print-ititle">'+l.i1.title+'</div><div class="print-itext">'+l.i1.text+'</div></div>'+
    '<div class="page-div">Page 2 &mdash; back side</div>'+
    '<div class="print-body">'+l.p2+'</div>'+
    '<div class="print-illus"><div class="print-ititle">'+l.i2.title+'</div><div class="print-itext">'+l.i2.text+'</div></div>'+
    '<div class="print-slabel">Discussion questions (on back)</div>'+pqs+
    '</div>'+
    '<button class="print-btn" id="pbtn">&#128424; Print this lesson (double-sided)</button>'+
    '<p class="print-note">Opens a formatted print page. Choose <strong>Print double-sided</strong> (flip on long edge) for a clean two-page take-home sheet.</p></div>';

  // Notes panel — built with DOM, NOT innerHTML, so inputs are fully interactive
  var notes = document.createElement('div');
  notes.id = 'panel-notes';
  notes.className = 'panel' + (currentPanel==='notes' ? ' active' : '');

  var nc1 = document.createElement('div'); nc1.className='card';
  var nt = document.createElement('div'); nt.className='card-title'; nt.innerHTML='&#128221; My notes &mdash; '+l.num;
  var np = document.createElement('p'); np.style.cssText='font-size:13px;color:#6b5d45;margin-bottom:.85rem;line-height:1.65';
  np.textContent='Type your notes, reflections, and thoughts below. Notes are kept while this file is open.';
  var ta = document.createElement('textarea');
  ta.id='nta'; ta.className='notes-textarea';
  ta.placeholder='Start typing your notes here\u2026\n\n\u2022 Key thoughts from the study\n\u2022 Personal reflections\n\u2022 Questions to explore\n\u2022 Things to follow up on';
  ta.value = (notesData[currentLesson]||{}).text||'';
  var nr = document.createElement('div'); nr.style.cssText='display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:2px';
  var sb = document.createElement('button'); sb.className='notes-btn'; sb.textContent='Save notes'; sb.onclick=saveNotes;
  var cb = document.createElement('button'); cb.className='notes-btn-clear'; cb.textContent='Clear'; cb.onclick=clearNotes;
  var st = document.createElement('span'); st.id='nst'; st.className='notes-status';
  nr.appendChild(sb); nr.appendChild(cb); nr.appendChild(st);
  nc1.appendChild(nt); nc1.appendChild(np); nc1.appendChild(ta); nc1.appendChild(nr);

  var nc2 = document.createElement('div'); nc2.className='card';
  var lt = document.createElement('div'); lt.className='card-title'; lt.innerHTML='&#128279; Web links &amp; resources';
  var lp = document.createElement('p'); lp.style.cssText='font-size:13px;color:#6b5d45;margin-bottom:1rem;line-height:1.65';
  lp.innerHTML='Paste a URL and give it a name, then click <strong>Add link</strong>. Saved links open in a new tab.';
  var lr = document.createElement('div'); lr.style.cssText='display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center';
  var ui = document.createElement('input'); ui.type='text'; ui.id='nurli'; ui.className='link-input';
  ui.placeholder='Paste URL here (e.g. https://\u2026)'; ui.style.flex='2'; ui.style.minWidth='200px';
  ui.addEventListener('keydown', onEnterLink);
  var li2 = document.createElement('input'); li2.type='text'; li2.id='nlabl'; li2.className='link-input';
  li2.placeholder='Link name (optional)'; li2.style.flex='1'; li2.style.minWidth='140px';
  li2.addEventListener('keydown', onEnterLink);
  var ab = document.createElement('button'); ab.className='link-add-btn'; ab.textContent='+ Add link'; ab.onclick=addLink;
  lr.appendChild(ui); lr.appendChild(li2); lr.appendChild(ab);
  var ll = document.createElement('div'); ll.id='nlst';
  nc2.appendChild(lt); nc2.appendChild(lp); nc2.appendChild(lr); nc2.appendChild(ll);

  notes.appendChild(nc1); notes.appendChild(nc2);

  // Assemble page
  main.innerHTML = '';
  main.appendChild(hdr);
  main.appendChild(tabBar);
  main.appendChild(study);
  main.appendChild(leader);
  main.appendChild(video);
  main.appendChild(discuss);
  main.appendChild(prayer);
  main.appendChild(music);
  main.appendChild(print);
  main.appendChild(notes);

  // Wire print button
  var pbtn = document.getElementById('pbtn');
  if(pbtn){ var ci=currentLesson; pbtn.onclick=function(){ openPrintWindow(ci); }; }

  // Populate links list if notes tab is active
  if(currentPanel==='notes') rebuildLinks();
}

buildPage();
</script>
</body>
</html>
